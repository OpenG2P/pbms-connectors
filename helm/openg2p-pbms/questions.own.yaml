# Questions for keys this chart owns, which exist in no dependency and so cannot
# be inherited. Appended verbatim to the generated questions.yaml at package time
# by openg2p/packaging ci/chart/inherit-questions.sh — variables here address the
# ROOT chart and are NOT path-prefixed.
#
# One block per register, identical apart from the register name. A new
# register copies a block (test/test_register_config.py checks every register
# has one). Connection string formats:
#   db:  postgresql://user:pass@host:5432/dbname (percent-encode the password)
#   dci: full search URL, http(s)://host[:port]/dci/sync/search?reg_type=..&reg_record_type=..&timeout=30&ssl_verify=true

# Farmer register
- variable: global.registers.farmer.connector
  description: How PBMS reads the farmer register. db queries the registry database. dci POSTs a DCI search to the URL in the connection string.
  type: enum
  options:
    - db
    - dci
  default: db
  label: Farmer Register Connector
  group: Farmer Register

- variable: global.registers.farmer.connectionString
  description: "db: postgresql://user:pass@host:5432/dbname. dci: the full search URL, http(s)://partner-api-host/dci/sync/search?reg_type=Farmer&reg_record_type=Farmer&timeout=30&ssl_verify=true (query params optional). Leave empty if no program uses this register."
  type: password
  default: 'postgresql://registry_user:CHANGE_ME@{{ .Values.global.postgresqlHost }}:5432/registry'
  label: Farmer Register Connection String
  group: Farmer Register

